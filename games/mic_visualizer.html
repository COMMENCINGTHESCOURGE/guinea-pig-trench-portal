<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIC VISUALIZER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c12; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(12,12,18,0.92);
    cursor: pointer; z-index: 10; transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-family: 'Segoe UI', sans-serif; font-size: 3rem; font-weight: 700;
    color: #00d2ff; letter-spacing: 0.15em; margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,210,255,0.4);
  }
  #overlay p {
    font-family: 'Segoe UI', sans-serif; font-size: 1.1rem; color: #ff60a0;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(4,10,20,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #00b8c8; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #00b8c8; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<div id="overlay">
  <h1>MIC VISUALIZER</h1>
  <p>Click to enable microphone</p>
</div>
<canvas id="c"></canvas>


<script src="js/mic_visualizer.js"></script></body>
</html>
