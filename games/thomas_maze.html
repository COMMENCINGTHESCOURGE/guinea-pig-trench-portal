<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thomas Attractor · Marching Cubes · Inbetween</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace}
#tmw{position:relative;width:100%;max-width:900px;background:#000}
#tmc{display:block;width:100%;cursor:grab}
#tmc:active{cursor:grabbing}
#tmctrl{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(4,4,4,0.9);padding:7px 16px;border-radius:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tml{font-family:monospace;font-size:11px;color:#555;display:flex;align-items:center;gap:5px}
input[type=range]{accent-color:#0ff;width:64px}
#tmmode{font-family:monospace;font-size:11px;color:#fa0;min-width:80px}
#tmbake{font-size:11px;font-family:monospace;padding:4px 10px;background:transparent;border:0.5px solid #444;color:#888;cursor:pointer;border-radius:3px}
#tmbake:hover{border-color:#0ff;color:#0ff}
</style>
</head>
<body>
<div id="tmw">
  <canvas id="tmc"></canvas>
  <div id="tmctrl">
    <div class="tml">b <input id="tmbp" type="range" min="0.10" max="0.25" step="0.001" value="0.19"></div>
    <div class="tml">bands <input id="tmbnd" type="range" min="3" max="30" step="1" value="10"></div>
    <div class="tml">&larr; structural &middot; melanin &rarr; <input id="tmblend" type="range" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="tml">iso <input id="tmiso" type="range" min="0.05" max="0.9" step="0.01" value="0.25"></div>
    <div id="tmmode">&#9679; inbetween</div>
    <button id="tmbake" onclick="exportMesh()">export .gltf</button>
  </div>
</div>
<script src="js/thomas_maze.js"></script>
</body>
</html>
