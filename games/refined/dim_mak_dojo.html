<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIM MAK DOJO · 點穴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0810;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;cursor:crosshair}
#gc{position:relative;z-index:1;background:transparent}

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,2,12,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #6688ff; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #6688ff; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<canvas id="bg" style="position:fixed;inset:0;z-index:0"></canvas>
<canvas id="gc"></canvas>
<script src="../js/raybg.js"></script>


<script src="js/dim_mak_dojo.js"></script></body>
</html>
