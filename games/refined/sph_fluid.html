<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUTH HOLDS PARTICLES v9.0 - Sovereign Equilibrium</title>
<style>
  body { margin:0; background:#000; overflow:hidden; font-family:'Courier New', monospace; cursor:none; }
  canvas { display:block; cursor:none; }
  #ui {
    position: fixed; top: 15px; left: 15px; color:#0f0; pointer-events:none;
    font-size:18px; text-shadow:2px 2px #000; z-index:10;
  }
  .accent { color:#0ff; font-weight:bold; }

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(20,10,4,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #ff8833; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #ff8833; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<div id="ui">
DOMAIN: <span class="accent">TRUTH_HOLDS</span> | 
BRUSH: <span id="brushName" class="accent">WATER</span> | 
STATUS: <span id="ecoStatus" class="accent">EQUILIBRIUM</span>
</div>
<canvas id="sim"></canvas>
