<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUINEA PIG TRENCH FM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--void:#03060f;--core:#00e5cc;--spectrum:#b06cf7;--stations:#f0a500;--volume:#f0365e;--logo:#dce8ff;--meter:#30e87a}
body{background:var(--void);width:100vw;height:100vh;overflow:hidden;font-family:'Courier New',monospace;user-select:none;cursor:default}
canvas#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
svg#tendrils{position:fixed;inset:0;pointer-events:none;z-index:1}
.blob{position:fixed;z-index:10;cursor:grab}
.blob:active{cursor:grabbing}
.blob-body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:transform .15s}
.blob:hover .blob-body{transform:scale(1.05)}
#b-logo .blob-body{width:134px;height:134px;background:radial-gradient(ellipse at 45% 38%,#111827,#040810 80%);border:1.5px solid rgba(220,232,255,.35);box-shadow:0 0 28px rgba(220,232,255,.12);animation:morph 14s ease-in-out infinite}
#b-core .blob-body{width:186px;height:186px;background:radial-gradient(ellipse at 40% 36%,#081f1e,#020c0b 80%);border:1.5px solid rgba(0,229,204,.4);box-shadow:0 0 36px rgba(0,229,204,.22);animation:morph 9s ease-in-out infinite}
#b-spectrum .blob-body{width:164px;height:164px;background:radial-gradient(ellipse at 55% 42%,#130d22,#070212 80%);border:1.5px solid rgba(176,108,247,.4);box-shadow:0 0 32px rgba(176,108,247,.2);animation:morph 7.5s ease-in-out infinite}
#b-stations .blob-body{width:160px;height:160px;background:radial-gradient(ellipse at 48% 55%,#1a1100,#0c0800 80%);border:1.5px solid rgba(240,165,0,.4);box-shadow:0 0 30px rgba(240,165,0,.18);animation:morph 11s ease-in-out infinite}
#b-volume .blob-body{width:146px;height:146px;background:radial-gradient(ellipse at 54% 36%,#1e0813,#0e040a 80%);border:1.5px solid rgba(240,54,94,.4);box-shadow:0 0 30px rgba(240,54,94,.2);animation:morph 13s ease-in-out infinite}
#b-meter .blob-body{width:136px;height:152px;background:radial-gradient(ellipse at 50% 58%,#051a0b,#020d05 80%);border:1.5px solid rgba(48,232,122,.4);box-shadow:0 0 30px rgba(48,232,122,.2);animation:morph 8s ease-in-out infinite}
@keyframes morph{0%{border-radius:63% 37% 29% 71%/61% 31% 69% 39%}33%{border-radius:43% 57% 64% 36%/51% 63% 37% 49%}66%{border-radius:56% 44% 47% 53%/39% 56% 44% 61%}100%{border-radius:63% 37% 29% 71%/61% 31% 69% 39%}}
.lbl{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:5px;opacity:.45}
.logo-wm{font-size:15px;font-weight:700;color:var(--logo);letter-spacing:.3em;text-shadow:0 0 18px rgba(220,232,255,.55)}
.logo-live{width:7px;height:7px;border-radius:50%;background:var(--core);box-shadow:0 0 10px var(--core);margin:8px auto 0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
.logo-sub{font-size:7px;letter-spacing:.4em;color:rgba(220,232,255,.3);margin-top:6px}
.core-stn{font-size:8.5px;color:var(--core);letter-spacing:.12em;text-align:center;margin-bottom:7px;text-shadow:0 0 12px var(--core);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-btn{width:46px;height:46px;border-radius:50%;background:transparent;border:1.5px solid var(--core);color:var(--core);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(0,229,204,.25);margin-bottom:8px;outline:none}
.play-btn:hover{background:rgba(0,229,204,.1);box-shadow:0 0 28px rgba(0,229,204,.5)}
.spec-bars{display:flex;align-items:flex-end;gap:2px;height:64px;width:116px}
.sbar{flex:1;background:linear-gradient(to top,var(--spectrum),rgba(176,108,247,.25));border-radius:1px 1px 0 0;min-height:2px;transition:height .04s}
.stn-list{width:128px;display:flex;flex-direction:column;gap:2px}
.stn-item{font-size:7.5px;color:rgba(240,165,0,.65);letter-spacing:.07em;cursor:pointer;padding:2px 5px;border-radius:2px;transition:all .18s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stn-item:hover,.stn-item.active{color:var(--stations);background:rgba(240,165,0,.1);text-shadow:0 0 9px var(--stations)}
.vol-wrap{width:74px;height:74px;cursor:ns-resize}
.vol-ring{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vol-inner{width:52px;height:52px;border-radius:50%;background:#0e040a;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--volume);pointer-events:none}
.meter-rows{display:flex;flex-direction:column;gap:4px;width:92px}
.meter-row{display:flex;align-items:center;gap:4px}
.meter-ch{font-size:7px;color:rgba(48,232,122,.5);width:8px}
.meter-track{flex:1;height:7px;background:rgba(48,232,122,.1);border-radius:4px;overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(to right,#30e87a,#a3f7bf,#f0a500,#f0365e);border-radius:4px;transition:width .06s}
.meter-peak{font-size:8px;color:var(--meter);margin-top:6px;text-align:center}
#footer{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.22em;color:rgba(255,255,255,.14);z-index:200;pointer-events:none}

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(5,15,10,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #00ff9d; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #00ff9d; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<canvas id="stars"></canvas>
<svg id="tendrils" xmlns="http://www.w3.org/2000/svg"><defs><filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>

<div class="blob" id="b-logo"><div class="blob-body"><div class="logo-wm">TRENCH</div><div class="logo-live" id="live-dot"></div><div class="logo-sub">&#183; FM &#183;</div></div></div>
<div class="blob" id="b-core"><div class="blob-body"><div class="lbl" style="color:var(--core)">CORE</div><div class="core-stn" id="stn-name">GROOVE SALAD</div><button class="play-btn" id="play-btn">&#9654;</button><div id="elapsed" style="font-size:11px;color:rgba(0,229,204,.65)">00:00</div><div id="status" style="font-size:7.5px;letter-spacing:.18em;margin-top:3px;color:rgba(0,229,204,.38)">IDLE</div></div></div>
<div class="blob" id="b-spectrum"><div class="blob-body"><div class="lbl" style="color:var(--spectrum)">SPECTRUM</div><div class="spec-bars" id="spec-bars"></div></div></div>
<div class="blob" id="b-stations"><div class="blob-body"><div class="lbl" style="color:var(--stations)">STATIONS</div><div class="stn-list" id="stn-list"></div></div></div>
<div class="blob" id="b-volume"><div class="blob-body"><div class="lbl" style="color:var(--volume)">VOLUME</div><div class="vol-wrap" id="vol-wrap"><div class="vol-ring" id="vol-ring"><div class="vol-inner" id="vol-pct">2%</div></div></div><div style="font-size:7.5px;color:rgba(240,54,94,.55);margin-top:6px;letter-spacing:.18em">GAIN</div></div></div>
<div class="blob" id="b-meter"><div class="blob-body"><div class="lbl" style="color:var(--meter)">METER</div><div class="meter-rows"><div class="meter-row"><span class="meter-ch">L</span><div class="meter-track"><div class="meter-fill" id="m-l" style="width:0%"></div></div></div><div class="meter-row"><span class="meter-ch">R</span><div class="meter-track"><div class="meter-fill" id="m-r" style="width:0%"></div></div></div></div><div class="meter-peak" id="m-peak">&#8722;&#8734; dB</div></div></div>

<div id="footer">GUINEA PIG TRENCH &#183; FM &#183; ohthatsthe / skippyohms</div>
<audio id="audio" crossorigin="anonymous" preload="none"></audio>



<script src="js/mantra_radio.js"></script></body>
</html>
