<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex Cards — Guinea Pig Trench</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a18; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; margin: 0 auto; cursor: pointer; }

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(20,10,4,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #ff8833; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #ff8833; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<canvas id="bg" style="position:fixed;inset:0;z-index:0"></canvas>
<canvas id="c" style="position:relative;z-index:1"></canvas>
<script src="../js/raybg.js"></script>



<script src="js/hex_cards.js"></script></body>
</html>
