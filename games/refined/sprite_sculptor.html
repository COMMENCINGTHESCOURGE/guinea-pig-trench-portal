<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPRITE SCULPTOR — 2D → 3D Raymarcher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#c{display:block;width:100%;height:100%;cursor:grab}
#c.drag{cursor:grabbing}
#ui{position:fixed;inset:0;pointer-events:none;font-family:'Courier New',monospace}
#info{position:absolute;top:16px;left:16px;color:rgba(0,255,210,.5);font-size:10px;letter-spacing:.14em;line-height:1.8}
#fps{position:absolute;top:16px;right:16px;color:rgba(0,210,255,.3);font-size:10px;letter-spacing:.14em;text-align:right}
#mode{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(0,255,210,.4);font-size:10px;letter-spacing:.25em;text-transform:uppercase;pointer-events:auto;display:flex;gap:12px}
#mode span{cursor:pointer;padding:4px 10px;border:1px solid rgba(0,255,210,.15);transition:all .2s}
#mode span:hover,#mode span.active{color:#00FFD2;border-color:rgba(0,255,210,.5);background:rgba(0,255,210,.05)}
#ctrl{position:absolute;bottom:16px;right:16px;color:rgba(0,210,255,.25);font-size:9px;letter-spacing:.12em;text-align:right;line-height:2}

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(4,10,20,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #00b8c8; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #00b8c8; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="info">SPRITE SCULPTOR<br>2D SPRITE → 3D RAYMARCHED OBJECT<br><br>G: EXPORT SPRITE SHEET<br>DROP IMAGE: LOAD YOUR SPRITE<br>1-4: CHANGE MODE<br><br>GUINEA PIG TRENCH · ohthatsthe</div>
  <div id="fps">—</div>
  <div id="mode">
    <span class="active" data-mode="0">HEIGHT MAP</span>
    <span data-mode="1">REVOLUTION</span>
    <span data-mode="2">CROSS SECTION</span>
    <span data-mode="3">MANDELBULB</span>
  </div>
  <div id="ctrl">DRAG · ORBIT<br>SCROLL · ZOOM<br>1-4 · MODE<br>DBL-CLICK · RESET</div>
</div>



<script src="js/sprite_sculptor.js"></script></body>
</html>
