<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRENCH CHRONICLES — The Onion Planet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; image-rendering: pixelated; }
#game { position: relative; z-index: 1; }
#ui-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 800px; height: 600px; pointer-events: none;
}
#choices {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
  width: 700px; display: none;
}
#choices button {
  background: rgba(0, 20, 40, 0.9); color: #00d2ff; border: 1px solid #00d2ff;
  padding: 10px 20px; font-family: 'Courier New', monospace; font-size: 14px;
  cursor: pointer; text-align: left; pointer-events: auto; transition: all 0.2s;
}
#choices button:hover { background: rgba(0, 210, 255, 0.2); color: #fff; }
#reaction-prompt {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 72px; color: #ff4400; font-family: 'Courier New', monospace;
  font-weight: bold; text-shadow: 0 0 30px #ff4400; display: none; pointer-events: none;
}
#click-continue {
  position: absolute; bottom: 155px; right: 60px;
  color: rgba(0, 210, 255, 0.5); font-size: 12px; font-family: 'Courier New', monospace;
  display: none; pointer-events: none; animation: blink 1.5s infinite;
}
@keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* -- THE THRESHOLD (pass 1) -- */
#threshold-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
}
#threshold-vignette {
  position: fixed; inset: 0; z-index: 9997; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,2,12,0.35));
}
#threshold-world-name {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none;
  color: #6688ff; opacity: 0.4;
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase;
}
#threshold-heartbeat {
  position: fixed; inset: 0; z-index: 9996; pointer-events: none;
  background: #6688ff; opacity: 0;
  transition: opacity 0.05s;
}

</style>
</head>
<body>
<canvas id="bg" style="position:fixed;inset:0;z-index:0"></canvas>
<canvas id="game" width="800" height="600"></canvas>
<div id="ui-overlay">
  <div id="choices"></div>
  <div id="reaction-prompt"></div>
  <div id="click-continue">[ click to continue ]</div>
</div>

<script src="../js/raybg.js"></script>



<script src="js/trench_story.js"></script></body>
</html>
