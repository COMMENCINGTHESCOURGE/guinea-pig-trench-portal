<title>THRESHOLD — Guinea Pig Trench</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#cfe;font-family:'Courier New',monospace;overflow:hidden;
     display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
canvas{border:1px solid #233;image-rendering:pixelated}
#hud{position:absolute;top:10px;left:12px;font-size:13px;line-height:1.5;text-shadow:0 0 4px #0ff8}
#wave-banner{position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:28px;
  color:#0fc;text-shadow:0 0 12px #0ff;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center}
#upgrade-ui{position:absolute;display:none;flex-direction:column;gap:8px;left:50%;top:30%;
  transform:translateX(-50%);z-index:10}
.up-card{display:flex;align-items:center;gap:10px;background:#112a;border:1px solid #0af;
  padding:10px 14px;cursor:pointer;width:320px;transition:transform .1s,border-color .1s}
.up-card:hover{transform:scale(1.03);border-color:#0ff}
.up-card img{width:48px;height:48px;image-rendering:auto}
.up-card .name{font-size:14px;color:#0fc;font-weight:bold}
.up-card .desc{font-size:11px;color:#89a}
#gameover{position:absolute;top:40%;left:50%;transform:translateX(-50%);text-align:center;display:none}
#gameover h2{color:#f45;font-size:26px;text-shadow:0 0 10px #f008}
#gameover p{margin-top:6px;color:#ac9}
#restart{margin-top:12px;padding:8px 20px;background:#123;border:1px solid #0af;color:#0fc;cursor:pointer;font-family:inherit}
</style>
</head>

const ROLES = {
  grouping:{name:'GROUPING',desc:'Projectiles cluster — pierce +1 enemy per level'},
  repetition:{name:'REPETITION',desc:'+1 projectile per level'},
  multiplication:{name:'MULTIPLICATION',desc:'×(1+0.25·lvl) damage on consecutive hits'},
  radical:{name:'RADICAL',desc:'Heal √damage dealt per level'},
  negation:{name:'NEGATION',desc:'Erase enemy bullets within radius'},
  conjugate:{name:'CONJUGATE',desc:'Reflect enemy projectiles back'},
  complement:{name:'COMPLEMENT',desc:'+Shield covering your weakest resist'},
  division:{name:'DIVISION',desc:'Split large enemies into two lesser'}
};
const ROLE_KEYS = Object.keys(ROLES);
// mod9 residue classes (verified stratification):
// {1,4,7}=STABLE {0,3,6}=BREACH {2,5,8}=NEUTRAL
function residueClass(n){ const r = ((n%9)+9)%9;
  if([1,4,7].includes(r)) return 'STABLE';
  if([0,3,6].includes(r)) return 'BREACH';
  return 'NEUTRAL';
}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const hud=document.getElementById('hud'),banner=document.getElementById('wave-banner'),
      upUI=document.getElementById('upgrade-ui'),goScreen=document.getElementById('gameover');

let player,enemies,bullets,ebullets,pickups,particles,wave,waveTimer,kills,
    upgrades,running,spawnQueue,conservationLedger,dmgDealtTotal;

function reset(){
  player={x:400,y:300,r:12,hp:100,maxhp:100,speed:170,fireRate:0.5,fireT:0,
          dmg:8,pierce:0,projectiles:1,multBonus:0,healOn:0,negRadius:0,
          reflect:false,shield:0,split:false,combo:0};
  enemies=[];bullets=[];ebullets=[];pickups=[];particles=[];
  wave=0;waveTimer=2;kills=0;upgrades={};running=true;
  conservationLedger={dropped:0,collected:0};
  dmgDealtTotal=0;
  goScreen.style.display='none';
}

function showBanner(text){
  banner.textContent=text;banner.style.opacity=1;
  setTimeout(()=>banner.style.opacity=0,1600);
}

function spawnWave(n){
  wave=n;
  const cls=residueClass(n);
  if(n%5===0){showBanner('⚠ ENTERING BREACH CORRIDOR — WAVE '+n);cls='BREACH';}
  else showBanner('WAVE '+n+' ['+cls+']');
  let count=6+n*2, speed, hp, tint;
  if(cls==='STABLE'){speed=42+n*2;hp=18+n*3;tint='#4af';}
  else if(cls==='BREACH'){speed=85+n*4;hp=12+n*2;tint='#f45';count=Math.floor(count*0.7);}
  else{speed=55+n;hp=15+n*2;tint='#fb5';}
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2, dist=420+Math.random()*120;
    enemies.push({x:player.x+Math.cos(ang)*dist,y:player.y+Math.sin(ang)*dist,
      r:9+(n>10?3:0),hp,maxhp:hp,speed:speed*(0.85+Math.random()*0.3),
      cls,tint,val:Math.ceil(hp/6),hit:false});
  }
}

function fireAt(nearest){
  for(let i=0;i<player.projectiles;i++){
    const spread=(i-(player.projectiles-1)/2)*0.14;
    const ang=Math.atan2(nearest.y-player.y,nearest.x-player.x)+spread;
    bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*380,vy:Math.sin(ang)*380,
      life:1.4,dmg:player.dmg*(1+player.multBonus*Math.min(player.combo,20)/20)});
  }
}

let upgradeChoices=[];
function offerUpgrades(){
  running='paused';
  const pool=[...ROLE_KEYS].sort(()=>Math.random()-0.5).slice(0,3);
  upgradeChoices=pool;
  upUI.innerHTML='';
  pool.forEach(key=>{
    const lvl=(upgrades[key]||0);
    const div=document.createElement('div');div.className='up-card';
    div.innerHTML=`<img src="${SPRITES[key]}"><div><div class="name">${ROLES[key].name} ${lvl?'→ Lv'+(lvl+1):''}</div><div class="desc">${ROLES[key].desc}</div></div>`;
    div.onclick=()=>applyUpgrade(key);
    upUI.appendChild(div);
  });
  upUI.style.display='flex';
}
function applyUpgrade(key){
  upgrades[key]=(upgrades[key]||0)+1;const lv=upgrades[key];
  if(key==='grouping')player.pierce+=1;
  if(key==='repetition')player.projectiles+=1;
  if(key==='multiplication')player.multBonus+=0.25;
  if(key==='radical')player.healOn+=1;
  if(key==='negation')player.negRadius+=45;
  if(key==='conjugate')player.reflect=true;
  if(key==='complement')player.shield+=15;
  if(key==='division')player.split=true;
  upUI.style.display='none';running=true;
  // conservation: upgrades are paid from collected currency surplus
  conservationLedger.collected-=5;
}

let keys={};
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);

function update(dt){
  if(running!=='true'&&running!==true)return;
  // movement
  let mx=(keys['d']||keys['ArrowRight']?1:0)-(keys['a']||keys['ArrowLeft']?1:0);
  let my=(keys['s']||keys['ArrowDown']?1:0)-(keys['w']||keys['ArrowUp']?1:0);
  const len=Math.hypot(mx,my)||1;
  player.x+=mx/len*player.speed*dt;player.y+=my/len*player.speed*dt;
  player.x=Math.max(14,Math.min(786,player.x));player.y=Math.max(14,Math.min(586,player.y));

  // auto-fire nearest
  player.fireT-=dt;
  const nearest=enemies.length?enemies.reduce((a,b)=>{
    const da=(a.x-player.x)**2+(a.y-player.y)**2,db=(b.x-player.x)**2+(b.y-player.y)**2;
    return da<db?a:b;}):null;
  if(nearest&&player.fireT<=0){fireAt(nearest);player.fireT=player.fireRate;}

  // bullets
  bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    b.hitSet=b.hitSet||new Set();});
  bullets=bullets.filter(b=>{
    if(b.life<=0)return false;
    for(const e of enemies){
      if(b.hitSet.has(e))continue;
      if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+4)**2){
        e.hp-=b.dmg;e.hit=true;b.hitSet.add(e);
        particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.3,c:'#fa0'});
        if(player.healOn){const heal=Math.sqrt(b.dmg)*player.healOn*0.5;
          player.hp=Math.min(player.maxhp,player.hp+heal);}
        dmgDealtTotal+=b.dmg;
        if(e.hp<=0)killEnemy(e);
        if(b.hitSet.size>player.pierce)return false;
      }
    }
    return true;
  });

  // enemy bullets (BREACH class shoots)
  ebullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;});
  ebullets=ebullets.filter(b=>{
    if(b.life<=0)return false;
    if((player.x-b.x)**2+(player.y-b.y)**2<(player.r+4)**2){
      hitPlayer(6);return false;}
    // NEGATION erase
    if(player.negRadius&&(b.x-player.x)**2+(b.y-player.y)**2<player.negRadius**2)return false;
    // CONJUGATE reflect
    if(player.reflect&&keys[' ']){b.vx*=-1;b.vy*=-1;b.reflected=true;}
    if(b.reflected){
      for(const e of enemies){if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+4)**2){e.hp-=12;
        if(e.hp<=0)killEnemy(e);return false;}}
    }
    return true;
  });

  // enemies chase
  enemies.forEach(e=>{
    const ang=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(ang)*e.speed*dt;e.y+=Math.sin(ang)*e.speed*dt;
    if((e.x-player.x)**2+(e.y-player.y)**2<(e.r+player.r)**2)hitPlayer(e.cls==='BREACH'?12:7,e);
    // BREACH shoot occasionally
    if(e.cls==='BREACH'&&Math.random()<dt*0.4){
      const a2=Math.atan2(player.y-e.y,player.x-e.x);
      ebullets.push({x:e.x,y:e.y,vx:Math.cos(a2)*150,vy:Math.sin(a2)*150,life:3});}
  });
  enemies=enemies.filter(e=>e.hp>0);

  // pickups
  pickups.forEach(p=>{p.t=(p.t||0)+dt;
    if((p.x-player.x)**2+(p.y-player.y)**2<400){p.x+=(player.x-p.x)*4*dt;p.y+=(player.y-p.y)*4*dt;}
    if((p.x-player.x)**2+(p.y-player.y)**2<200){conservationLedger.collected++;p.dead=true;}});
  pickups=pickups.filter(p=>!p.dead);

  // shield regen
  if(player.shield>0)player.shieldHp=Math.min(player.shield,(player.shieldHp||0)+dt*1.5);

  // waves
  waveTimer-=dt;
  if(waveTimer<=0||enemies.length===0&&waveTimer<12){
    offerUpgrades();
    spawnQueue=setTimeout(()=>{},0);
    waveTimer=999; // resume after upgrade pick
    pendingWave=true;
  }
  if(pendingWave&&!upUI.style.display.includes('flex')){
    pendingWave=false;spawnWave(wave+1);waveTimer=Math.max(8,16-wave*0.4);
  }
}

let pendingWave=false;
function hitPlayer(dmg,src){
  if(player.shieldHp>0){player.shieldHp-=dmg;if(player.shieldHp<0){player.hp+=player.shieldHp;player.shieldHp=0;}}
  else player.hp-=dmg;
  if(src&&player.split&&src.maxhp>=40&&src.r>=12){
    src.hp=0;for(let i=0;i<2;i++)enemies.push({...src,x:src.x+i*20-10,y:src.y+i*14-7,hp:src.maxhp/2,maxhp:src.maxhp/2,r:src.r*0.7,speed:src.speed*1.3,val:src.val/2});
  }
  particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.3,c:'#f45'});
  if(player.hp<=0)gameOver();
}
function killEnemy(e){
  kills++;
  for(let i=0;i<e.val;i++)
    pickups.push({x:e.x+(Math.random()-.5)*24,y:e.y+(Math.random()-.5)*24});
  conservationLedger.dropped+=e.val;
  for(let i=0;i<6;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.4,c:e.tint});
}
function gameOver(){
  running=false;goScreen.style.display='block';
  document.getElementById('final-stats').textContent=
    `Wave ${wave} | ${kills} kills | Conservation Δ=${conservationLedger.dropped-conservationLedger.collected}`;
}
document.getElementById('restart').onclick=()=>{reset();pendingWave=false;waveTimer=1;};

function draw(){
  ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,800,600);
  // grid
  ctx.strokeStyle='#151522';ctx.beginPath();
  for(let x=0;x<800;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,600);}
  for(let y=0;y<600;y+=40){ctx.moveTo(0,y);ctx.lineTo(800,y);}
  ctx.stroke();

  // pickups (gold)
  ctx.fillStyle='#fd0';
  pickups.forEach(p=>ctx.fillRect(p.x-2,p.y-2,4,4));
  // particles
  particles.forEach(p=>{ctx.globalAlpha=p.life*2;ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);});
  ctx.globalAlpha=1;
  // enemies colored by residue class
  enemies.forEach(e=>{ctx.fillStyle=e.tint;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
    ctx.fillStyle='#0008';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText(e.cls[0],e.x,e.y+3);});
  // bullets
  ctx.fillStyle='#fff';bullets.forEach(b=>ctx.fillRect(b.x-3,b.y-1.5,6,3));
  ctx.fillStyle='#f66';ebullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();});
  // player with sigil
  ctx.save();ctx.translate(player.x,player.y);
  const img=new Image();img.src=SPRITES.grouping;
  try{ctx.drawImage(img,-14,-14,28,28);}catch(e){}
  ctx.strokeStyle='#0cf';ctx.beginPath();ctx.arc(0,0,player.r+3,0,7);ctx.stroke();
  ctx.restore();
  // negation radius
  if(player.negRadius){ctx.strokeStyle='#06a4';ctx.beginPath();ctx.arc(player.x,player.y,player.negRadius,0,7);ctx.stroke();}
  // hp bar
  ctx.fillStyle='#333';ctx.fillRect(player.x-16,player.y-24,32,4);
  ctx.fillStyle='#0d0';ctx.fillRect(player.x-16,player.y-24,32*Math.max(0,player.hp)/player.maxhp,4);
  if(player.shieldHp>0){ctx.fillStyle='#0af';ctx.fillRect(player.x-16,player.y-29,32*Math.min(1,player.shieldHp/player.shield),3);}

  // HUD
  hud.innerHTML=`HP ${Math.max(0,player.hp|0)}/${player.maxhp} | WAVE ${wave} [${residueClass(wave)}] | KILLS ${kills}`+
    `<br>Credits: dropped ${conservationLedger.dropped} / collected ${conservationLedger.collected} (Δ=${conservationLedger.dropped-conservationLedger.collected})`+
    `<br>`+ROLE_KEYS.map(k=>upgrades[k]?`${ROLES[k].name.slice(0,4)}:${upgrades[k]}`:'').filter(Boolean).join(' ');
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
